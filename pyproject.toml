[project]
name = "agri-coop-trace-inventory"
version = "0.1.0"
description = "农业合作社农产品批次追溯与智能库存预警系统"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "email-validator>=2.3.0",
    "faker>=40.38.0",
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "qrcode[pil]>=8.2",
    "redis>=6.4.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
